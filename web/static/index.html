<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Voice Analysis</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Classroom Voice Analysis</h1>
    <span class="sub">upload a lesson recording &rarr; transcript, speakers, teacher analysis</span>
  </header>

  <div class="panel">
    <h2>New recording</h2>

    <div class="drop" id="drop">
      <strong id="dropLabel">Drop an audio file here, or click to choose</strong>
      <span>mp3, wav, m4a, aac, ogg, opus, flac, or a video file</span>
      <input type="file" id="file" hidden
             accept=".mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.wma,.mp4,.mkv,.webm,.mov">
    </div>

    <div class="opts">
      <label class="field"><span>Language</span>
        <select id="language">
          <option value="ml" selected>Malayalam</option>
          <option value="hi">Hindi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="kn">Kannada</option>
          <option value="en">English</option>
        </select>
      </label>

      <label class="field"><span>Whisper model</span>
        <select id="model_size">
          <option value="tiny">tiny &middot; fastest</option>
          <option value="base">base</option>
          <option value="small" selected>small &middot; balanced</option>
          <option value="medium">medium &middot; best</option>
        </select>
      </label>

      <label class="field"><span>Speakers (exact)</span>
        <input type="number" id="num_speakers" min="1" max="20" placeholder="auto">
      </label>

      <label class="field"><span>Speakers (max)</span>
        <input type="number" id="max_speakers" min="2" max="20" placeholder="auto">
      </label>
    </div>

    <label class="checkline">
      <input type="checkbox" id="use_llm" checked>
      Run the AI teaching review as well as the metrics
    </label>

    <div style="margin-top:18px; display:flex; gap:10px; align-items:center;">
      <button id="go" disabled>Transcribe &amp; analyse</button>
      <span class="sub" id="hint">Pick a file to start.</span>
    </div>

    <div class="err" id="err" hidden></div>
  </div>

  <div class="panel">
    <h2>Sessions</h2>
    <div id="jobs"><p class="empty">Nothing uploaded yet.</p></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file");
let chosen = null;

drop.onclick = () => fileInput.click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]);
};
fileInput.onchange = () => fileInput.files[0] && pick(fileInput.files[0]);

function pick(f) {
  chosen = f;
  const mb = (f.size / 1048576).toFixed(1);
  $("dropLabel").textContent = `${f.name} · ${mb} MB`;
  $("go").disabled = false;
  $("hint").textContent = "Runs on CPU — expect roughly the length of the recording.";
}

function show(msg) {
  const box = $("err");
  box.hidden = !msg;
  box.textContent = msg || "";
}

$("go").onclick = async () => {
  if (!chosen) return;
  show("");
  $("go").disabled = true;
  $("hint").textContent = "Uploading…";

  const body = new FormData();
  body.append("file", chosen);
  body.append("language", $("language").value);
  body.append("model_size", $("model_size").value);
  body.append("use_llm", $("use_llm").checked ? "true" : "false");
  if ($("num_speakers").value) body.append("num_speakers", $("num_speakers").value);
  if ($("max_speakers").value) body.append("max_speakers", $("max_speakers").value);

  try {
    const r = await fetch("/api/upload", { method: "POST", body });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "upload failed");
    $("hint").textContent = "Queued.";
    $("dropLabel").textContent = "Drop an audio file here, or click to choose";
    chosen = null;
    fileInput.value = "";
    refresh();
  } catch (e) {
    show(e.message);
    $("hint").textContent = "";
    $("go").disabled = false;
  }
};

function elapsed(from, to) {
  if (!from || !to) return "—";
  const s = Math.max(0, (new Date(to) - new Date(from)) / 1000);
  if (s < 90) return `${Math.round(s)}s`;
  const m = Math.round(s / 60);
  return m < 90 ? `${m} min` : `${(m / 60).toFixed(1)} hr`;
}

function stamp(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString([], {
    month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
  });
}

async function refresh() {
  let data;
  try {
    data = await (await fetch("/api/jobs")).json();
  } catch { return; }

  const el = $("jobs");
  if (!data.jobs.length) {
    el.innerHTML = '<p class="empty">Nothing uploaded yet.</p>';
    return;
  }

  // Jobs run one at a time, so a queued job can sit for a long while. Say
  // why, and say what it is waiting behind - an unexplained "—" reads as
  // broken when it actually means "working, just not on this one yet".
  const running = data.jobs.filter(j => j.status === "running").length;
  let ahead = 0;

  el.innerHTML = `<table><thead><tr>
      <th>File</th><th>Status</th><th style="width:190px">Progress</th><th>Uploaded</th><th></th>
    </tr></thead><tbody>${data.jobs.slice().reverse().map(j => {
      const pct = Math.round((j.progress || 0) * 100);
      let detail;
      if (j.status === "failed") {
        detail = `<div class="sub mono" style="color:var(--bad)">${esc(j.error || "failed")}</div>`;
      } else if (j.status === "running") {
        detail = `<div class="bar"><i style="width:${pct}%"></i></div>
          <div class="sub" style="font-size:12px;margin-top:3px">${pct}% · ${esc(j.stage || "")}${
            j.note ? " · " + esc(j.note) : ""}</div>`;
      } else if (j.status === "queued") {
        const n = ahead++;
        detail = `<div class="sub" style="font-size:12.5px">waiting${
          running ? " — one lesson is transcribing" : ""}${
          n ? `, ${n} ahead of it` : ""}</div>
          <div class="sub" style="font-size:11px;color:var(--muted)">jobs run one at a time</div>`;
      } else {
        detail = `<div class="sub" style="font-size:12.5px">finished in ${
          elapsed(j.created_at, j.finished_at)}</div>`;
      }
      return `<tr>
        <td>${j.status === "done"
              ? `<a href="/jobs/${j.id}">${esc(j.filename)}</a>`
              : esc(j.filename)}
            <div class="sub mono" style="font-size:11px">${j.id}</div></td>
        <td><span class="pill ${j.status}">${j.status}</span></td>
        <td>${detail}</td>
        <td class="sub">${stamp(j.created_at)}</td>
        <td>${j.status === "done" ? `<a href="/jobs/${j.id}">Open</a>` : ""}</td>
      </tr>`;
    }).reverse().join("")}</tbody></table>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
