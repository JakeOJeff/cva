<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session &middot; Classroom Voice Analysis</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1 id="title">Session</h1>
    <a href="/">&larr; All sessions</a>
  </header>
  <div class="sub" id="subtitle"></div>

  <div id="body"><p class="empty">Loading…</p></div>
</div>

<div id="tip" hidden></div>

<script>
const jobId = location.pathname.split("/").pop();
const $ = (id) => document.getElementById(id);
const tip = $("tip");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mmss = (t) => `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const pct = (x) => `${Math.round((x || 0) * 100)}%`;

// Colour follows the speaker, not their rank in whatever is on screen now.
// Fixed order, never cycled: past five speakers everyone shares the muted slot.
let colorOf = {};
function assignColors(res) {
  const teacher = res.teacher.teacher;
  const others = Object.keys(res.speakers)
    .filter(s => s !== teacher)
    .sort((a, b) => res.speakers[b].talk_time - res.speakers[a].talk_time);
  colorOf = { [teacher]: "var(--sp1)" };
  others.forEach((s, i) => {
    colorOf[s] = i < 4 ? `var(--sp${i + 2})` : "var(--muted)";
  });
}

function showTip(e, html) {
  tip.innerHTML = html;
  tip.hidden = false;
  const pad = 14;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + pad, innerWidth - r.width - 8) + "px";
  tip.style.top = Math.min(e.clientY + pad, innerHeight - r.height - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };

/* ------------------------------------------------------------ sections */

function tiles(m) {
  const wait = m.median_wait_time == null ? "—" : `${m.median_wait_time.toFixed(1)}s`;
  const waitNote = m.median_wait_time == null ? "no questions detected"
    : m.median_wait_time < 3 ? "under the 3s threshold"
    : "3s or more — good";
  const items = [
    ["Teacher talk", pct(m.teacher_talk_ratio), "share of all speech"],
    ["Students", pct(m.student_talk_ratio), `${m.n_students_heard} heard`],
    ["Questions", m.teacher_questions, `${m.questions_per_10min}/10 min`],
    ["Median wait", wait, waitNote],
    ["Answered", pct(m.question_response_rate), `${m.questions_answered} of ${m.teacher_questions}`],
    ["Lesson", mmss(m.duration), `${pct(m.silence_ratio)} silence`],
  ];
  return `<div class="tiles">${items.map(([k, v, n]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>
     <div class="n">${esc(n)}</div></div>`).join("")}</div>`;
}

function proportion(m) {
  const parts = [
    ["Teacher", m.teacher_talk_time, "var(--sp1)"],
    ["Students", m.student_talk_time, "var(--sp2)"],
    ["Silence", m.silence_time, "var(--line)"],
  ].filter(p => p[1] > 0);
  const total = parts.reduce((s, p) => s + p[1], 0) || 1;

  return `<div class="panel"><h2>Where the lesson went</h2>
    <div class="prop">${parts.map(([label, v, c]) =>
      `<div data-tip="<b>${label}</b><br>${mmss(v)} · ${pct(v / total)} of the lesson"
            style="flex:${v};background:${c}"></div>`).join("")}</div>
    <div class="legend">${parts.map(([label, v, c]) =>
      `<span><i style="background:${c}"></i>${label} ${pct(v / total)}</span>`).join("")}</div>
  </div>`;
}

function timeline(res) {
  const dur = res.meta.duration || 1;
  const bands = res.utterances.map(u =>
    `<i style="left:${(u.start / dur) * 100}%;width:${Math.max(((u.end - u.start) / dur) * 100, 0.12)}%;
       background:${colorOf[u.speaker] || "var(--muted)"}"
       data-tip="<b>${esc(u.label)}</b> · ${mmss(u.start)}–${mmss(u.end)}<br>${esc(u.text.slice(0, 110))}${u.text.length > 110 ? "…" : ""}"></i>`
  ).join("");

  const legend = Object.entries(res.speakers)
    .map(([sp, s]) => `<span><i style="background:${colorOf[sp]}"></i>${esc(s.label)} · ${pct(s.talk_share)}</span>`)
    .join("");

  return `<div class="panel"><h2>Who spoke when</h2>
    <div class="timeline">${bands}</div>
    <div class="axis"><span>00:00</span><span>${mmss(dur / 2)}</span><span>${mmss(dur)}</span></div>
    <div class="legend">${legend}</div>
  </div>`;
}

function verdict(res) {
  const v = res.teacher;
  const opts = Object.entries(res.speakers).map(([sp, s]) =>
    `<option value="${sp}" ${sp === v.teacher ? "selected" : ""}>${esc(s.label)} — ${sp} (${pct(s.talk_share)})</option>`
  ).join("");

  const low = v.confidence === "low" ? `<div class="warnbox">
    <b>Low confidence.</b> The top two speakers scored within ${(v.margin ?? 0).toFixed(2)} of
    each other. That usually means co-teaching, one very talkative student, or a diarization
    that split one person across two labels. Check the timeline and correct it below if needed.
  </div>` : "";

  return `<div class="panel"><h2>Teacher</h2>
    <div class="verdict">
      <div style="flex:1;min-width:240px">
        <div class="who" style="color:${colorOf[v.teacher]}">${esc(res.speakers[v.teacher]?.label || v.teacher)}
          <span class="sub mono" style="color:var(--muted);font-size:12px">${esc(v.teacher)}</span></div>
        <div class="sub">${esc(v.confidence)} confidence · ${esc(v.method)}</div>
        <ul>${(v.reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      </div>
      <div style="min-width:230px">
        <label class="field"><span>Wrong? Set it by hand</span>
          <select id="teacherPick">${opts}</select></label>
        <div style="margin-top:9px;display:flex;gap:8px;align-items:center">
          <button id="applyTeacher">Re-analyse</button>
          <span class="sub" id="teacherMsg"></span>
        </div>
      </div>
    </div>
    ${low}
  </div>`;
}

function review(res) {
  const r = res.review;
  if (!r) return "";
  if (r.error) {
    return `<div class="panel"><h2>AI teaching review</h2>
      <p class="empty">${esc(r.error)}</p></div>`;
  }
  const sect = (title, html) => `<h3>${title}</h3>${html}`;
  const list = (arr) => `<ul>${(arr || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

  return `<div class="panel review"><h2>AI teaching review</h2>
    ${sect("Summary", `<p>${esc(r.summary)}</p>`)}
    ${sect("Topics covered", `<div class="tags">${(r.topics_covered || [])
      .map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`)}

    ${sect(`Questioning <span class="tag">${esc(r.questioning.dominant_question_type.replace(/_/g, " "))}</span>`,
      `<p>${esc(r.questioning.assessment)}</p>${list(r.questioning.examples)}`)}

    ${sect("Explanation", `<p>${esc(r.explanation_quality.assessment)}</p>
      <div class="tags">
        <span class="tag">${r.explanation_quality.uses_examples ? "uses examples" : "few examples"}</span>
        <span class="tag">${r.explanation_quality.checks_understanding ? "checks understanding" : "rarely checks understanding"}</span>
      </div>`)}

    ${sect(`Feedback to students <span class="tag">${esc(r.feedback_to_students.specificity)}</span>`,
      `<p>${esc(r.feedback_to_students.assessment)}</p>`)}

    ${sect("Classroom management", `<p>${esc(r.classroom_management)}</p>`)}
    ${sect("Language use", `<p>${esc(r.language_use)}</p>`)}
    ${sect("What worked", list(r.strengths))}

    ${sect("What to try next", `<ul>${(r.areas_for_improvement || []).map(a =>
      `<li><b>${esc(a.issue)}</b><br>${esc(a.suggestion)}</li>`).join("")}</ul>`)}

    ${sect("Notable moments", (r.notable_moments || []).map(m =>
      `<div class="moment"><div class="t">${esc(m.timestamp)}</div>
       <div>${esc(m.what_happened)}</div>
       <div class="sub" style="color:var(--muted)">${esc(m.why_it_matters)}</div></div>`).join(""))}

    ${r.transcript_quality_caveat
      ? `<div class="warnbox"><b>On the transcript itself.</b> ${esc(r.transcript_quality_caveat)}</div>` : ""}

    <div class="sub" style="margin-top:16px;color:var(--muted);font-size:12px">
      ${esc(r._model || "")} · ${r._usage ? `${r._usage.input_tokens} in / ${r._usage.output_tokens} out tokens` : ""}
    </div>
  </div>`;
}

function transcript(res) {
  return `<div class="panel"><h2>Transcript</h2>
    <div class="filters">
      <button data-role="" class="on">Everyone</button>
      <button data-role="teacher">Teacher only</button>
      <button data-role="student">Students only</button>
      <span class="sub" id="uttCount"></span>
    </div>
    <div id="utts"></div>
  </div>`;
}

function renderUtts(res, role) {
  const utts = role ? res.utterances.filter(u => u.role === role) : res.utterances;
  $("uttCount").textContent = `${utts.length} utterances`;
  $("utts").innerHTML = utts.map(u => `
    <div class="utt ${u.speaker_conf < 0.75 ? "low" : ""}">
      <div class="t">${mmss(u.start)}</div>
      <div class="who" style="color:${colorOf[u.speaker] || "var(--muted)"}">${esc(u.label)}</div>
      <div class="tx">${esc(u.text)}</div>
    </div>`).join("") || '<p class="empty">Nothing here.</p>';
}

/* ---------------------------------------------------------------- live */

// Colours for provisional, chunk-local speakers. They are deliberately NOT
// the final palette: until reconcile runs, "c3_SPEAKER_00" and
// "c7_SPEAKER_00" are unrelated, and showing them in the same colour would
// assert something we do not yet know.
function provisionalColor(speaker) {
  let h = 0;
  for (const ch of speaker) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `var(--sp${(h % 5) + 1})`;
}

function live(status) {
  $("body").innerHTML = `
    <div class="panel">
      <h2>Working</h2>
      <div class="bar"><i id="liveBar" style="width:${Math.round((status.progress || 0) * 100)}%"></i></div>
      <div class="sub" id="liveNote" style="margin-top:8px">${esc(status.stage || "")} · ${esc(status.note || "")}</div>
      <div class="warnbox" style="margin-top:14px">
        <b>Speaker labels below are provisional.</b> Each block is analysed on
        its own, so a voice in block 1 and the same voice in block 5 do not yet
        know they are the same person. When the audio runs out they are matched
        across the whole lesson and relabelled — only then are the teacher and
        the metrics worked out.
      </div>
    </div>
    <div class="panel">
      <h2>Transcript <span id="liveCount" class="sub" style="text-transform:none"></span></h2>
      <div id="liveUtts"><p class="empty">Waiting for the first block…</p></div>
    </div>`;

  let seen = 0;
  const box = $("liveUtts");
  const es = new EventSource(`/api/jobs/${jobId}/stream`);

  // Keep the status bar moving between chunk events.
  const poll = setInterval(async () => {
    try {
      const s = await (await fetch(`/api/jobs/${jobId}`)).json();
      const bar = $("liveBar");
      if (bar) bar.style.width = `${Math.round((s.progress || 0) * 100)}%`;
      const note = $("liveNote");
      if (note) note.textContent = `${s.stage || ""} · ${s.note || ""}`;
    } catch {}
  }, 3000);

  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);

    if (ev.type === "meta") {
      $("subtitle").textContent =
        `${mmss(ev.duration)} · ${ev.n_chunks} blocks · whisper ${ev.model} · ${ev.language}`;
      if (ev.language_mismatch) {
        box.insertAdjacentHTML("beforebegin",
          `<div class="warnbox"><b>Language mismatch.</b> Transcribing as
           ${esc(ev.language)} but this sounds like ${esc(ev.detected_language)}.</div>`);
      }
    }

    if (ev.type === "chunk") {
      if (seen === 0) box.innerHTML = "";
      seen += ev.utterances.length;
      $("liveCount").textContent =
        `— ${seen} utterances, block ${ev.index + 1} of ${ev.of}`;
      box.insertAdjacentHTML("beforeend",
        `<div class="sub" style="margin:14px 0 6px;color:var(--muted);font-size:11px;
              text-transform:uppercase;letter-spacing:.06em">
           block ${ev.index + 1} · ${mmss(ev.start)}–${mmss(ev.end)}</div>` +
        ev.utterances.map(u => `
          <div class="utt">
            <div class="t">${mmss(u.start)}</div>
            <div class="who" style="color:${provisionalColor(u.speaker)}">${esc(u.speaker)}</div>
            <div class="tx">${esc(u.text)}</div>
          </div>`).join(""));
      box.parentElement.scrollIntoView({ block: "nearest" });
    }

    if (ev.type === "reconciled") {
      $("liveNote").textContent =
        `matched ${Object.keys(ev.mapping).length} chunk-speakers into ${ev.n_speakers} people`;
    }

    if (ev.type === "done" || ev.type === "ended") {
      es.close();
      clearInterval(poll);
      load();                       // swap in the finished report
    }
  };

  es.onerror = () => {
    // EventSource retries on its own; only give up once the job is finished.
    fetch(`/api/jobs/${jobId}`).then(r => r.json()).then(s => {
      if (s.status === "done" || s.status === "failed") {
        es.close(); clearInterval(poll); load();
      }
    }).catch(() => {});
  };
}

/* ------------------------------------------------------------------ go */

async function load() {
  const status = await (await fetch(`/api/jobs/${jobId}`)).json();
  $("title").textContent = status.filename || "Session";

  if (status.status === "failed") {
    $("subtitle").textContent = "failed";
    $("body").innerHTML = `<div class="panel"><div class="err">${esc(status.error)}</div></div>`;
    return;
  }

  if (status.status !== "done") {
    live(status);          // stream the lesson in as it is processed
    return;
  }

  const res = await (await fetch(`/api/jobs/${jobId}/result`)).json();
  assignColors(res);
  $("subtitle").textContent =
    `${mmss(res.meta.duration)} · ${res.meta.n_speakers} speakers · ` +
    `whisper ${res.meta.model} · ${res.meta.language} · analysed in ${res.meta.elapsed}s`;

  // A wrong language does not fail loudly in Whisper - it produces fluent
  // nonsense. Say so at the top, before anyone reads the analysis of it.
  const langWarn = res.meta.language_mismatch ? `<div class="panel">
    <div class="warnbox"><b>Language mismatch.</b> This was transcribed as
    <b>${esc(res.meta.requested_language)}</b>, but the audio sounds like
    <b>${esc(res.meta.detected_language)}</b> (confidence
    ${esc(res.meta.detected_confidence)}). Whisper does not fail on the wrong
    language, it invents plausible words — so treat the transcript and
    everything derived from it as unreliable, and re-run in
    ${esc(res.meta.detected_language)}.</div></div>` : "";

  $("body").innerHTML = langWarn +
    `<div class="panel"><h2>At a glance</h2>${tiles(res.metrics)}</div>` +
    verdict(res) + proportion(res.metrics) + timeline(res) +
    review(res) + transcript(res);

  renderUtts(res, "");

  document.querySelectorAll(".filters button").forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(".filters button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      renderUtts(res, b.dataset.role);
    };
  });

  $("applyTeacher").onclick = async () => {
    const btn = $("applyTeacher");
    btn.disabled = true;
    $("teacherMsg").textContent = "Re-deriving…";
    const body = new FormData();
    body.append("speaker", $("teacherPick").value);
    body.append("use_llm", "false");
    const r = await fetch(`/api/jobs/${jobId}/teacher`, { method: "POST", body });
    if (r.ok) location.reload();
    else {
      $("teacherMsg").textContent = (await r.json()).detail || "failed";
      btn.disabled = false;
    }
  };
}

// One delegated hover handler covers every mark on the page.
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el) showTip(e, el.dataset.tip); else hideTip();
});
document.addEventListener("mouseleave", hideTip);

load();
</script>
</body>
</html>
